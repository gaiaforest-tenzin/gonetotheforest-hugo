{{ partial "header.html" . }}

<h1 class="post-title" data-pagefind-ignore>{{ .Title }}</h1>

<span class="post-date">{{ .Date.Format "January 2, 2006" }}{{ with .Params.location }} — {{ . }}{{ end }}</span>

{{ .Content }}

{{ with .Params.external_link }}
  <p><a href="{{ . }}" target="_blank" rel="noopener">Event details / RSVP →</a></p>
{{ end }}

{{ range .Params.categories }}<span data-pagefind-filter="Category" style="display:none;">{{ . }}</span>{{ end }}

{{ partial "footer.html" . }}
