baseURL = "https://tenzin.gaiaforest.org"
languageCode = "en-us"
title = "gone to the forest"

# Build future-dated content. Essential for this site: an "upcoming event"
# is by definition dated in the future, and Hugo SKIPS such pages entirely
# unless told otherwise -- so without this, every upcoming event silently
# vanishes and the Events page reads "No upcoming events at this time."
# Netlify's build command passes --buildFuture explicitly, but a plain
# local `hugo server` does not; setting it here means local preview always
# matches the live site without having to remember the flag.
buildFuture = true

# Enable HTML in markdown
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Site parameters
[params]
  description = "Gone to the Forest - Buddhist and ecological retreat experiences"

